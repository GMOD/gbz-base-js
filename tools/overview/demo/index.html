<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pangenome overview</title>
    <style>
      :root {
        color-scheme: light;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 12px 16px;
        background: #fff;
        color: #222;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        margin-bottom: 8px;
      }
      label {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      input[type='text'] {
        width: 26em;
      }
      input[type='number'] {
        width: 9em;
      }
      button {
        padding: 2px 8px;
      }
      #status {
        margin: 6px 0;
        font-variant-numeric: tabular-nums;
        white-space: pre-wrap;
      }
      #view {
        position: relative;
      }
      canvas {
        display: block;
        max-width: 100%;
      }
      #tip {
        position: absolute;
        pointer-events: none;
        background: #222;
        color: #fff;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <form id="controls">
      <label>graph <input type="text" name="graph" /></label>
      <label>index <input type="text" name="index" /></label>
      <label
        >path
        <select name="path"></select
      ></label>
      <label>start <input type="number" name="start" min="0" step="1" /></label>
      <label>end <input type="number" name="end" min="1" step="1" /></label>
      <button type="submit">Draw</button>
      <button type="button" data-act="whole">Whole contig</button>
      <button type="button" data-act="in">Zoom in</button>
      <button type="button" data-act="out">Zoom out</button>
      <button type="button" data-act="left">←</button>
      <button type="button" data-act="right">→</button>
    </form>
    <div id="status">Enter the graph and haplotype index URLs, then Draw.</div>
    <div id="view">
      <canvas id="canvas" width="1800" height="400"></canvas>
      <div id="tip"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
